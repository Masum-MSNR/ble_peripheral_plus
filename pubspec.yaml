name: ble_peripheral_plus
description: A maintained fork of ble_peripheral for using a device as a Bluetooth Low Energy peripheral.
version: 2.5.1
homepage: https://github.com/Masum-MSNR/ble_peripheral_plus
repository: https://github.com/Masum-MSNR/ble_peripheral_plus
issue_tracker: https://github.com/Masum-MSNR/ble_peripheral_plus/issues

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  pigeon: ^17.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rohit.ble_peripheral
        pluginClass: BlePeripheralPlugin
      ios:
        pluginClass: BlePeripheralPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: BlePeripheralPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: BlePeripheralPluginCApi
