name: ble_peripheral_plus
description: A maintained Flutter BLE peripheral and GATT server plugin for Android, iOS, macOS, and Windows, based on ble_peripheral.
version: 2.5.2
homepage: https://github.com/Masum-MSNR/ble_peripheral_plus
repository: https://github.com/Masum-MSNR/ble_peripheral_plus
issue_tracker: https://github.com/Masum-MSNR/ble_peripheral_plus/issues
documentation: https://github.com/Masum-MSNR/ble_peripheral_plus#readme
topics:
  - bluetooth
  - ble
  - gatt
  - peripheral
  - flutter-plugin

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  pigeon: ^17.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rohit.ble_peripheral
        pluginClass: BlePeripheralPlugin
      ios:
        pluginClass: BlePeripheralPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: BlePeripheralPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: BlePeripheralPluginCApi
